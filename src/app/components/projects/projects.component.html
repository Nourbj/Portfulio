<section id="projects" class="projects">
  <div class="background-animation">
    <div class="circles"></div>
    <div class="grid"></div>
  </div>

  <div class="container">
    <h2>My Projects</h2>
    <p class="subtitle">
      A selection of my favorite projects that showcase my skills and passion for web & mobile development.
    </p>

    <div class="projects-grid">
      <div class="project-card" *ngFor="let project of projects">
        <!-- Media Area -->
        <div class="project-media" [class.no-screenshot]="!project.screenshots" (click)="project.screenshots ? openImage(project.screenshots) : null">
          <div class="overlay" *ngIf="project.screenshots">
            <i class="fas fa-expand"></i>
          </div>
          <img *ngIf="project.screenshots" [src]="project.screenshots" [alt]="project.title + ' screenshots'" />
          <div class="placeholder-graphic" *ngIf="!project.screenshots">
            <img
              *ngIf="project.logo"
              [src]="project.logo"
              [alt]="project.title + ' logo'"
              class="placeholder-logo"
            />
          </div>
        </div>

        <div class="card-content">
          <div class="title-area">
            <h3 class="project-title">
              <img
                *ngIf="project.logo"
                [src]="project.logo"
                [alt]="project.title + ' logo'"
                class="project-logo"
              />
              {{ project.title }}
            </h3>
          </div>

          <div class="description-area">
            <p>{{ project.description }}</p>
          </div>

          <div class="footer-area">
            <ul class="tech-list">
              <li *ngFor="let t of project.tech">{{ t }}</li>
            </ul>

            <div class="card-links">
              <a
                *ngIf="project.github"
                [href]="project.github"
                target="_blank"
                rel="noopener noreferrer"
                aria-label="GitHub"
              >
                <i class="fab fa-github"></i>
              </a>

              <a
                *ngIf="project.liveDemo"
                [href]="project.liveDemo"
                target="_blank"
                rel="noopener noreferrer"
                aria-label="Live Demo"
              >
                <i class="fas fa-external-link-alt"></i>
              </a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Image Modal -->
  <div class="image-modal" *ngIf="selectedImage" (click)="closeImage()">
    <div class="modal-content" (click)="$event.stopPropagation()">
      <button class="close-btn" (click)="closeImage()" aria-label="Close modal">&times;</button>
      <img [src]="selectedImage" alt="Enlarged screenshot" />
    </div>
  </div>
</section>
